<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    iframe { width: 100%; height: 100%; border: none; }
    .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #555; font-family: system-ui, sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <div class="empty" id="placeholder">No video loaded</div>
  <script>
    function loadFromHash() {
      var hash = location.hash.slice(1);
      if (!hash) return;
      var params = new URLSearchParams(hash);
      var videoId = params.get('v');
      if (!videoId) return;

      document.getElementById('placeholder').style.display = 'none';
      var existing = document.querySelector('iframe');
      if (existing) existing.remove();

      var embedParams = new URLSearchParams({
        autoplay: '1',
        rel: '0',
        modestbranding: '1',
        controls: '1'
      });
      if (params.get('muted') === '1') embedParams.set('mute', '1');

      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/' + videoId + '?' + embedParams;
      iframe.allow = 'autoplay; encrypted-media';
      iframe.allowFullscreen = true;
      document.body.appendChild(iframe);
    }

    window.addEventListener('hashchange', loadFromHash);
    loadFromHash();
  </script>
</body>
</html>
