<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscrub Split View</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #00A651;
      --green-soft: #E8F8EF;
      --green-text: #006B35;
      --bg: #f4f4f5;
      --card: #ffffff;
      --txt: #1a1a1a;
      --txt-mid: #555;
      --txt-light: #999;
      --txt-faint: #ccc;
      --border: #e2e2e4;
      --r: 16px;
      --r-sm: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--txt);
      overflow: hidden;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 12px;
      gap: 0;
    }

    /* Header */
    #panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 12px;
    }

    .logo-pill {
      display: inline-flex;
      background: #1a1a1a;
      padding: 5px 14px;
      border-radius: 20px;
    }
    .logo-pill span {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: -0.3px;
    }

    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--txt-light);
      letter-spacing: -0.2px;
    }

    /* Slots */
    .slot {
      display: flex;
      flex-direction: column;
      min-height: 80px;
      overflow: hidden;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--r);
    }

    #slot-top { flex: 1 1 50%; }
    #slot-bottom { flex: 1 1 50%; }

    .slot-controls {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      background: var(--green-soft);
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .slot-label {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--green-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .slot-controls input {
      flex: 1;
      padding: 6px 10px;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--card);
      color: var(--txt);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
    }

    .slot-controls input::placeholder {
      color: var(--txt-faint);
    }

    .slot-controls input:focus {
      outline: none;
      border-color: var(--green);
    }

    .slot-controls button {
      padding: 6px 14px;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--card);
      color: var(--txt-mid);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .slot-controls button:hover {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .slot-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .slot-controls .clear-btn {
      padding: 6px 10px;
      color: var(--txt-light);
    }

    .slot-controls .clear-btn:hover {
      background: #fee;
      color: #c44;
      border-color: #ecc;
    }

    .video-area {
      flex: 1;
      position: relative;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0 0 calc(var(--r) - 2px) calc(var(--r) - 2px);
      overflow: hidden;
    }

    .video-area iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-area .placeholder {
      color: var(--txt-faint);
      font-size: 13px;
      font-style: italic;
    }

    /* Drag handle */
    #drag-handle {
      height: 14px;
      cursor: row-resize;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #drag-handle::after {
      content: "";
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.15s;
    }

    #drag-handle:hover::after, #drag-handle.dragging::after {
      background: var(--green);
    }

    /* Layout toggle button */
    .layout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--card);
      color: var(--txt-light);
      cursor: pointer;
      transition: all 0.15s;
      padding: 0;
    }
    .layout-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }

    /* Horizontal layout */
    #slots-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #slots-wrap.horizontal {
      flex-direction: row;
    }

    #slots-wrap.horizontal .slot {
      min-height: 0;
      min-width: 80px;
    }

    #slots-wrap.horizontal #slot-top { flex: 1 1 50%; }
    #slots-wrap.horizontal #slot-bottom { flex: 1 1 50%; }

    #slots-wrap.horizontal .slot-controls {
      flex-direction: column;
      padding: 6px;
      gap: 4px;
    }

    #slots-wrap.horizontal .slot-controls input {
      width: 100%;
    }

    #slots-wrap.horizontal .slot-controls .slot-actions {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    #slots-wrap.horizontal .slot-controls .slot-actions button {
      flex: 1;
    }

    #slots-wrap.horizontal #drag-handle {
      width: 14px;
      height: auto;
      cursor: col-resize;
      flex-direction: column;
    }

    #slots-wrap.horizontal #drag-handle::after {
      width: 4px;
      height: 40px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="panel-header">
      <div class="logo-pill">
        <span style="color: #00A651;">SUB</span><span style="color: #fff;">SCRUB</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="panel-title">Split View</span>
        <button id="toggle-layout" class="layout-btn" title="Toggle vertical/horizontal">
          <svg id="layout-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="1" width="14" height="6" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <rect x="1" y="9" width="14" height="6" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="slots-wrap">
      <div id="slot-top" class="slot">
        <div class="slot-controls">
          <span class="slot-label">A</span>
          <input type="text" id="url-top" placeholder="Paste YouTube URL...">
          <div class="slot-actions">
            <button id="load-top">Load</button>
            <button id="clear-top" class="clear-btn">&#x2715;</button>
          </div>
        </div>
        <div class="video-area" id="video-top">
          <span class="placeholder">No video loaded</span>
        </div>
      </div>

      <div id="drag-handle"></div>

      <div id="slot-bottom" class="slot">
        <div class="slot-controls">
          <span class="slot-label">B</span>
          <input type="text" id="url-bottom" placeholder="Paste YouTube URL...">
          <div class="slot-actions">
            <button id="load-bottom">Load</button>
            <button id="clear-bottom" class="clear-btn">&#x2715;</button>
          </div>
        </div>
        <div class="video-area" id="video-bottom">
          <span class="placeholder">No video loaded</span>
        </div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
