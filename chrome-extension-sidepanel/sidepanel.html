<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subsnub Split View</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #00A651;
      --green-soft: #E8F8EF;
      --green-text: #006B35;
      --bg: #f4f4f5;
      --card: #ffffff;
      --txt: #1a1a1a;
      --txt-mid: #555;
      --txt-light: #999;
      --txt-faint: #ccc;
      --border: #e2e2e4;
      --r: 16px;
      --r-sm: 12px;
    }

    [data-theme="dark"] {
      --bg: #1a1a1a;
      --card: #252525;
      --txt: #e0e0e0;
      --txt-mid: #aaa;
      --txt-light: #777;
      --txt-faint: #555;
      --border: #383838;
      --green-soft: #1a2e22;
      --green-text: #66d98e;
    }

    [data-theme="dark"] .logo-pill {
      background: #000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--txt);
      overflow: hidden;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 12px;
      gap: 0;
    }

    /* Header */
    #panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 12px;
    }

    .logo-pill {
      display: inline-flex;
      background: #1a1a1a;
      padding: 5px 14px;
      border-radius: 20px;
    }
    .logo-pill span {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--txt-light);
      letter-spacing: -0.2px;
    }

    /* Icon buttons */
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--card);
      color: var(--txt-light);
      cursor: pointer;
      transition: all 0.15s;
      padding: 0;
    }
    .icon-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }

    /* Slots */
    .slot {
      display: flex;
      flex-direction: column;
      min-height: 80px;
      overflow: hidden;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--r);
    }

    #slot-top { flex: 1 1 50%; }
    #slot-bottom { flex: 1 1 50%; }

    .slot-bar {
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      background: var(--green-soft);
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .slot-label {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--green-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .slot-bar .spacer { flex: 1; }

    .slot-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--txt-light);
      cursor: pointer;
      transition: all 0.15s;
      padding: 0;
    }
    .slot-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }
    .slot-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .slot-btn.clear-btn:hover {
      background: #fee;
      color: #c44;
      border-color: #ecc;
    }

    .video-area {
      flex: 1;
      position: relative;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0 0 calc(var(--r) - 2px) calc(var(--r) - 2px);
      overflow: hidden;
    }

    .video-area iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-area .placeholder {
      color: var(--txt-faint);
      font-size: 13px;
      font-style: italic;
    }

    /* Drag handle */
    #drag-handle {
      height: 14px;
      cursor: row-resize;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #drag-handle::after {
      content: "";
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.15s;
    }

    #drag-handle:hover::after, #drag-handle.dragging::after {
      background: var(--green);
    }

    /* Horizontal layout */
    #slots-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #slots-wrap.horizontal {
      flex-direction: row;
    }

    #slots-wrap.horizontal .slot {
      min-height: 0;
      min-width: 80px;
    }

    #slots-wrap.horizontal #slot-top { flex: 1 1 50%; }
    #slots-wrap.horizontal #slot-bottom { flex: 1 1 50%; }

    #slots-wrap.horizontal #drag-handle {
      width: 14px;
      height: auto;
      cursor: col-resize;
      flex-direction: column;
    }

    #slots-wrap.horizontal #drag-handle::after {
      width: 4px;
      height: 40px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="panel-header">
      <div class="logo-pill">
        <span style="color: #00A651;">SUB</span><span style="color: #fff;">SNUB</span>
      </div>
      <div class="header-actions">
        <span class="panel-title">Split View</span>
        <button id="swap-btn" class="icon-btn" title="Swap videos">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M4 1.5v11M4 1.5L1.5 4M4 1.5L6.5 4M10 12.5v-11M10 12.5L7.5 10M10 12.5L12.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="toggle-theme" class="icon-btn" title="Toggle light/dark mode">
          <svg id="theme-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M13 8.5a5.5 5.5 0 01-7.5-7.5 6.5 6.5 0 107.5 7.5z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="toggle-layout" class="icon-btn" title="Toggle vertical/horizontal">
          <svg id="layout-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="1" width="14" height="6" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <rect x="1" y="9" width="14" height="6" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="slots-wrap">
      <div id="slot-top" class="slot">
        <div class="slot-bar">
          <span class="slot-label">A</span>
          <span class="spacer"></span>
          <button class="slot-btn clear-btn" data-slot="top" title="Remove video">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="video-area" id="video-top">
          <span class="placeholder">No video loaded</span>
        </div>
      </div>

      <div id="drag-handle"></div>

      <div id="slot-bottom" class="slot">
        <div class="slot-bar">
          <span class="slot-label">B</span>
          <span class="spacer"></span>
          <button class="slot-btn clear-btn" data-slot="bottom" title="Remove video">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="video-area" id="video-bottom">
          <span class="placeholder">No video loaded</span>
        </div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
